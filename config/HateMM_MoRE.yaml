##RADAR
data:
  task: binary
  text_encoder: D:/code/LAB/my_MoRE_cloud/MoRE2026-Cloud/models/bert/bert-base-uncased
  num_pos: 30
  num_neg: 90

para:
  text_encoder: D:/code/LAB/my_MoRE_cloud/MoRE2026-Cloud/models/bert/bert-base-uncased
  fea_dim: 64                    # 降低特征维度
  num_epoch: 50
  delta: 0.4                      # 增加delta让正负样本更难区分
  alpha: 0.6                      # 稍微平衡多模态权重
  num_pos: 30
  num_neg: 90
  dropout: 0.3                    # 添加dropout

  #RADAR
  use_radar: true                     # 开启RADAR
  radar_at_test: true                  # 测试时也使用
  memory_size: 1024                    # 记忆库大小
  entropy_threshold: 0.1                # 熵阈值（保守）
  num_retrieve: 3                       # 检索数量
  align_loss_weight: 0.5                 # 对齐损失权重（重要！）
  self_train_temperature: 0.2            # 温度参数
  pseudo_alpha: 0.7                      # 伪标签alpha
  pseudo_beta: 0.3                       # 伪标签beta
  use_pseudo_label: false                 # 伪标签关闭
  history_size: 2048

opt:
  name: AdamW
  lr: 0.0007                       # 降低学习率
  weight_decay: 0.002              # 增加权重衰减

sche:
  name: DummyLR

num_epoch: 50
batch_size: 128
seed: 2024
model: MoRE
dataset: HateMM
type: default
patience: 7
